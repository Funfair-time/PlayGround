<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#071b26" />
  <title>LANE 09 — Bowling Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Lane 09 Startseite"><span class="brand-mark">09</span><span class="brand-copy">LANE<span> / BOWLING CLUB</span></span></a>
      <div class="venue"><i class="live-dot"></i><span>THE MIDNIGHT LANES</span><b>•</b><span>BAHN 09</span></div>
      <button class="sound-button" id="soundButton" aria-label="Ton aktivieren"><span class="sound-icon">♪</span><span>TON AN</span></button>
    </header>

    <section class="play-area" aria-label="Bowlingbahn">
      <div id="scene" class="scene"></div>
      <div class="scene-vignette"></div>
      <div class="scene-label"><span class="eyebrow">DEIN WURF</span><span class="lane-number">09</span></div>
      <div class="aim-indicator" id="aimIndicator"><span class="aim-line"></span><span class="aim-label">ZIELRICHTUNG</span></div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="drag-hint" id="dragHint"><span class="gesture-icon"><i></i></span><span>KUGEL ZURÜCKZIEHEN & LOSLASSEN</span></div>
      <div class="side-note"><span>PINDECK</span><i></i><span>38,4 M</span></div>
    </section>

    <section class="control-deck">
      <div class="scoreboard">
        <div class="score-heading"><span class="eyebrow">DEIN SPIEL</span><span id="gameStatus" class="status-pill"><i></i> BEREIT</span></div>
        <div class="score-row" id="scoreRow" aria-label="Spielstand"></div>
      </div>
      <div class="player-card">
        <div class="player-avatar">M</div>
        <div class="player-meta"><span class="eyebrow">SPIELER:IN</span><strong>DU</strong></div>
        <div class="player-score"><span class="eyebrow">PUNKTE</span><strong id="totalScore">—</strong></div>
      </div>
      <div class="shot-controls">
        <div class="ball-selector">
          <span class="eyebrow">KUGEL</span><button class="ball-choice" id="ballChoice"><span class="mini-ball"></span><span>STORM<br><b>14 LB</b></span><span class="chevron">⌄</span></button>
        </div>
        <div class="power-meter"><div class="meter-heading"><span class="eyebrow">WURFKRAFT</span><span id="powerText">—</span></div><div class="meter-track"><i id="powerFill"></i><span></span><span></span><span></span><span></span></div><div class="meter-labels"><span>SOFT</span><span>MAX</span></div></div>
        <button class="reset-button" id="resetButton" aria-label="Spiel neu starten" title="Spiel neu starten">↻</button>
      </div>
    </section>
    <footer class="helpbar"><span><b>TOUCH</b> Kugel nach hinten ziehen und nach vorne schnippen</span><span><b>DESKTOP</b> Klicken, ziehen & loslassen</span><span class="help-right">ÖL-MUSTER: <b>HOUSE SHOT</b></span></footer>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
